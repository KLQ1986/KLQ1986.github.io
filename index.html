<h1>CyberX</h1>
<p>CyberX is a private automation tool that one person runs on their own computer. It is not a public service and has no
other users.</p>
<p>It signs in with Google only to the owner's own accounts: to sort the owner's Gmail and to publish and measure the
owner's own YouTube videos.</p>
